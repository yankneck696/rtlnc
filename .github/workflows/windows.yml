# Builds the Windows app + installer on every push / manual run.
# Download them from the run's "Artifacts" section.
name: windows-build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller pytest
          python -m pip uninstall -y pyrtlsdrlib
      - name: Tests (simulator)
        run: python -m pytest -q tests
      - name: Fetch RTL-SDR Blog V4 DLLs
        shell: pwsh
        run: ./packaging/fetch_dlls.ps1
      - name: Build rtlnc.exe
        run: pyinstaller --noconfirm --clean packaging/rtlnc.spec
      - name: Smoke test (subcommand in the frozen exe)
        shell: pwsh
        run: |
          $env:RTLNC_LOG = "$env:RUNNER_TEMP\smoke.log"
          $p = Start-Process dist\rtlnc\rtlnc.exe -ArgumentList "core --sim 1 --no-audio --seconds 8 --bus 127.0.0.1:7399" -PassThru -Wait
          Get-Content $env:RTLNC_LOG
          if (-not (Select-String -Path $env:RTLNC_LOG -Pattern "acq ch1")) { throw "frozen core did not acquire" }
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\rtlnc.iss
      - uses: actions/upload-artifact@v4
        with:
          name: rtlnc-windows
          path: |
            dist/installer/*.exe
            dist/rtlnc/**
      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
          generate_release_notes: true
