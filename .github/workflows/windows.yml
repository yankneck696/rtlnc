# Builds, tests and packages the Windows app on every push.
#  * Every run: tests, rtlnc.exe, installer, smoke tests of the packaged app
#    (core in simulator mode + the launcher's Start/Stop in Demo mode).
#  * Push to main with a new version in pyproject.toml: also creates the
#    GitHub Release vX.Y.Z with the installer attached. No manual tagging.
name: windows-build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        shell: pwsh
        run: |
          $v = python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "VERSION=$v" >> $env:GITHUB_ENV
          Write-Host "rtlnc $v"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller pytest
          python -m pip uninstall -y pyrtlsdrlib
      - name: Tests (simulator)
        run: python -m pytest -q tests
      - name: Fetch RTL-SDR Blog V4 DLLs
        shell: pwsh
        run: ./packaging/fetch_dlls.ps1
      - name: Build rtlnc.exe
        run: pyinstaller --noconfirm --clean packaging/rtlnc.spec
      - name: Smoke test - packaged core (simulator)
        shell: pwsh
        run: |
          $env:RTLNC_LOG = "$env:RUNNER_TEMP\smoke.log"
          Start-Process dist\rtlnc\rtlnc.exe -ArgumentList "core --sim 1 --no-audio --seconds 8 --bus 127.0.0.1:7399" -Wait
          Get-Content $env:RTLNC_LOG
          if (-not (Select-String -Path $env:RTLNC_LOG -Pattern "acq ch1")) { throw "frozen core did not acquire" }
      - name: Smoke test - packaged launcher (Demo mode Start/Stop)
        shell: pwsh
        run: ./packaging/smoke_launcher.ps1
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" packaging\rtlnc.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: rtlnc-windows
          path: |
            dist/installer/*.exe
            dist/rtlnc/**
      - name: New version? (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $exists = git ls-remote --tags origin "refs/tags/v$env:VERSION"
          if ($exists) { Write-Host "v$env:VERSION already released" }
          else {
            "NEW_RELEASE=1" >> $env:GITHUB_ENV
            python packaging/release_notes.py $env:VERSION release-notes.md
            if ($LASTEXITCODE -ne 0) { throw "release notes failed" }
          }
      - name: Publish release (new version on main)
        if: env.NEW_RELEASE == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: rtlnc ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: dist/installer/*.exe
      - name: Publish release (version tag pushed)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
          generate_release_notes: true
